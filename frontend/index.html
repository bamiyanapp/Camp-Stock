<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>camp-stock</title>
    <!--
      正式なPWA（スタンドアロン表示）として認識させるための設定。
      iOS Safariでホーム画面に追加しただけの簡易的なブックマークではなく
      manifest.jsonを伴うPWAとして認識されることで、ストレージ
      （Cookie/localStorage）の永続性が改善する可能性がある
      （docs参照: iOSのIntelligent Tracking Preventionによる予告なき
      ストレージ消去が既知の課題のため。効果はApple側の非公開の内部動作に
      依存し保証はできない）。
    -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!--
      全プロダクト共通のフォント規約（dev-standards/docs/frontend-ui-conventions.md）。
      M PLUS Rounded 1cをGoogle Fontsから読み込む。
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <meta name="theme-color" content="#2f5233" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Camp Stock" />
    <!--
      PWA起動時の白画面対策（docs/pwa-initial-loading-indicator.md参照）。
      JS・ビルド後CSSに依存しない静的ローディング表示。ReactのcreateRoot(...).render()が
      #rootの中身を丸ごと置き換えるため、マウント完了と同時に自動的に消える
    -->
    <style>
      #initial-loading {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #1f2937;
      }
      #initial-loading div {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 4px solid rgba(127, 127, 127, 0.3);
        border-top-color: currentColor;
        animation: initial-loading-spin 0.8s linear infinite;
      }
      @keyframes initial-loading-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-color-scheme: dark) {
        #initial-loading {
          background: #1d232a;
          color: #a6adbb;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loading" aria-hidden="true">
        <div></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
