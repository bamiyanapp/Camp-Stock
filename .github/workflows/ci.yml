name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ci:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-ci.yml@v2.18.1
    with:
      frontend_dir: frontend
      backend_dir: backend
      node_version: "22"
      # shared/pwa/等、sync-manifest.local.json経由でdev-standards submodule配下の
      # 実ファイルをsymlink共有しているため、bootstrap.js --checkによる
      # symlink欠落・リンク切れの自動検知を有効にする
      enable_standards_check: true
      # 開発共通標準の目標値80%以上（dev-standards docs/reusable-workflows-reference.md
      # 「coverage_threshold」参照）に合わせた。backend/frontendそれぞれの現状の
      # カバレッジ実績（2026-09-16時点、backend: statements 87.63% / branches
      # 82.49% / functions 84.00% / lines 87.32%、frontend: statements 92.71% /
      # branches 85.43% / functions 88.70% / lines 92.82%。frontendはIssue #305
      # 対応でapi/client.js・ShareButton.jsxのテストを追加しfunctionsを
      # 80.22%→88.70%へ引き上げた）のうち最も低い指標（backendのbranches
      # 82.49%）にも数ポイントの余裕を持たせた値。backendのsrc/repositories/*
      # （DynamoDB SDKの薄いラッパーで、in-memory repositoryを使う単体テストでは
      # 意図的にカバーしない設計）が全体平均を大きく下げているため、
      # coverage_check_per_fileは有効にしない（ファイル単位判定にすると
      # このディレクトリが常に閾値未達になってしまう）。
      coverage_threshold: 80
      # frontend/e2e/配下のPlaywrightテスト（backend/e2e/testServer.jsによる
      # 実AWS・実Google認証を使わないE2Eテスト基盤、#106）を実行する。
      # スクリーンショットはJob Summary・PRコメントへ画像として直接埋め込まれる
      # （dev-standards/docs/cicd-pipeline-specification.md参照）。
      enable_e2e_test: true
      # jscpdによるコード重複検知（duplication-check）。現状の重複率
      # （2026-09-13時点、テストファイル・e2eディレクトリ除外、合計2.77%。
      # jsx形式のみ見ると6.23%だが、-tの閾値判定はフォーマット別ではなく
      # 合計値に対して行われる）に数ポイントの余裕を持たせた値として5を設定する。
      enable_duplication_check: true
      duplication_threshold: 5
      # Markdownドキュメント（README.md・CLAUDE.md）へtextlintを実行する（Issue #307）。
      # 共有設定（textlint.config.cjs、dev-standards submodule配下からのsymlink）は
      # プロダクト側の追加インストール不要でCI側がnpx経由で取得する。CHANGELOG.md
      # （semantic-releaseの自動生成物）・.clinerules/*.md（dev-standards由来のsymlink、
      # 実体はdev-standards自身のnpm test内で検証済み）は対象外にする。
      enable_text_lint: true
      text_lint_paths: "README.md\nCLAUDE.md"
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
