name: CD

on:
  push:
    branches: [main]

jobs:
  release:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-cd.yml@v2.5.1
    with:
      enable_shared_release_config: true
    secrets:
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}

  deploy:
    name: Deploy to AWS
    needs: release
    if: needs.release.outputs.new_release_published == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      AWS_REGION: ap-northeast-1
      STACK_NAME: camp-stock
    steps:
      # frontend/src/components/ServiceWorkerRegistration.jsx・UpdateNotifier.jsxは
      # dev-standards/shared/pwa/実体へのsymlinkのため、submoduleを取得しないと
      # リンク切れになりnpm run buildが失敗する（issue #114）。
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup AWS SAM CLI
        uses: aws-actions/setup-sam@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # GOOGLE_OAUTH_CLIENT_IDの値そのものはClaude（このリポジトリを操作するAI）
      # からは確認できない（Secretsは書き込み専用、フロントエンド配信元への
      # 直接アクセスも開発環境の制約上できない）。形式チェックとハッシュの
      # 記録により、値の異常や「更新したつもりが反映されていない」を
      # スマートフォンのJob Summaryから確認できるようにする。
      - name: Validate GOOGLE_OAUTH_CLIENT_ID
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          if [[ -z "$GOOGLE_CLIENT_ID" ]]; then
            echo "::error::GOOGLE_OAUTH_CLIENT_ID が設定されていません（Secretsが空、または未登録です）"
            exit 1
          fi
          if [[ ! "$GOOGLE_CLIENT_ID" =~ ^[0-9]+-[a-zA-Z0-9]+\.apps\.googleusercontent\.com$ ]]; then
            echo "::error::GOOGLE_OAUTH_CLIENT_ID の形式が不正です。Google Cloud Console の「クライアントID」欄の値（*.apps.googleusercontent.com 形式）と一致しているか確認してください（Client Secretと取り違えていないか等）"
            exit 1
          fi
          hash_prefix=$(printf '%s' "$GOOGLE_CLIENT_ID" | sha256sum | cut -c1-8)
          {
            echo "## GOOGLE_OAUTH_CLIENT_ID検証"
            echo ""
            echo "- 形式チェック: OK"
            echo "- ハッシュ（先頭8文字、値そのものではない）: \`$hash_prefix\`"
            echo "- 前回デプロイ時と異なる値であるべきか確認する場合は、この値を前回のJob Summaryと比較してください"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build backend (SAM)
        working-directory: infra
        run: sam build

      # SAMの管理用S3バケットは--resolve-s3で自動作成・再利用する
      - name: Deploy backend (SAM)
        working-directory: infra
        env:
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: |
          sam deploy \
            --stack-name "$STACK_NAME" \
            --resolve-s3 \
            --capabilities CAPABILITY_IAM \
            --no-confirm-changeset \
            --no-fail-on-empty-changeset \
            --parameter-overrides "GoogleClientId=${GOOGLE_CLIENT_ID}"

      - name: Get stack outputs
        id: stack-outputs
        run: |
          get_output() {
            aws cloudformation describe-stacks \
              --stack-name "$STACK_NAME" \
              --query "Stacks[0].Outputs[?OutputKey=='$1'].OutputValue" \
              --output text
          }
          echo "api_endpoint=$(get_output ApiEndpoint)" >> "$GITHUB_OUTPUT"
          echo "frontend_bucket=$(get_output FrontendBucketName)" >> "$GITHUB_OUTPUT"
          echo "frontend_distribution_id=$(get_output FrontendDistributionId)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(get_output FrontendUrl)" >> "$GITHUB_OUTPUT"

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ steps.stack-outputs.outputs.api_endpoint }}
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: npm run build

      # index.html・sw.js・sw-config.jsは常に最新を取得させるためno-cache、
      # コンテンツハッシュ付きのassets/*は長期キャッシュ（immutable）にする。
      # これを分けないと、ブラウザにキャッシュされた古いindex.htmlが、
      # 削除済みの古いハッシュ付きアセットや古いAPIエンドポイントを参照し
      # 続けてしまう。sw.js・sw-config.jsも同様に、長期キャッシュされると
      # ブラウザ・CDN側で更新チェック自体が古いスクリプトを参照し続け、
      # PWA（ホーム画面に追加した状態）でアプリが更新されない原因になる
      # （dev-standards/docs/service-worker-update-pattern.md参照）。
      - name: Upload frontend to S3
        run: |
          aws s3 sync frontend/dist "s3://${{ steps.stack-outputs.outputs.frontend_bucket }}" \
            --delete \
            --cache-control "public, max-age=31536000, immutable" \
            --exclude index.html \
            --exclude sw.js \
            --exclude sw-config.js
          aws s3 cp frontend/dist/index.html \
            "s3://${{ steps.stack-outputs.outputs.frontend_bucket }}/index.html" \
            --cache-control "no-cache"
          aws s3 cp frontend/dist/sw.js \
            "s3://${{ steps.stack-outputs.outputs.frontend_bucket }}/sw.js" \
            --cache-control "no-cache"
          aws s3 cp frontend/dist/sw-config.js \
            "s3://${{ steps.stack-outputs.outputs.frontend_bucket }}/sw-config.js" \
            --cache-control "no-cache"

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ steps.stack-outputs.outputs.frontend_distribution_id }}" \
            --paths "/*"

      - name: Write deployment URLs to job summary
        run: |
          {
            echo "## デプロイ完了"
            echo ""
            echo "- フロントエンド: ${{ steps.stack-outputs.outputs.frontend_url }}"
            echo "- API: ${{ steps.stack-outputs.outputs.api_endpoint }}"
          } >> "$GITHUB_STEP_SUMMARY"
