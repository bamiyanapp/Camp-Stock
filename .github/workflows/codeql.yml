name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    # 毎週月曜9:00 JST（0:00 UTC）。コード変更が無い期間もCodeQLのクエリセット
    # 自体の更新を検知するための定期実行。
    - cron: "0 0 * * 1"

permissions:
  # SARIFをGitHub Securityタブへアップロードするためにreusable-codeql.yml側が要求する権限。
  # 呼び出し元（このワークフロー）で明示しない場合、リポジトリ既定のGITHUB_TOKEN権限
  # （security-events: writeを含まない）が上限になりアップロードが失敗するため必須。
  security-events: write
  actions: read
  contents: read

jobs:
  codeql:
    uses: bamiyanapp/dev-standards/.github/workflows/reusable-codeql.yml@v2.17.4
