AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: >
  Camp Stock - キャンプの持ち物管理アプリのバックエンド（Lambda + API Gateway + DynamoDB）

Globals:
  Function:
    Timeout: 10
    MemorySize: 256
    Runtime: nodejs22.x
    Environment:
      Variables:
        ITEMS_TABLE_NAME: !Ref ItemsTable
        CAMPS_TABLE_NAME: !Ref CampsTable
        CAMP_ITEMS_TABLE_NAME: !Ref CampItemsTable

Resources:
  # 明示的に定義し、CORS設定（プリフライトのOPTIONSをAPI Gateway側で自動応答）を
  # 行う。POST/PUT/DELETEはContent-Type: application/jsonを伴うためCORSの
  # シンプルリクエストの条件を満たさず、ブラウザがプリフライトリクエストを送信する。
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins:
          - !Sub "https://${FrontendDistribution.DomainName}"
        AllowHeaders:
          - Content-Type
          - Authorization
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS

  ItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: camp-stock-items
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: itemId
          KeyType: HASH

  CampsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: camp-stock-camps
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: campId
          AttributeType: S
      KeySchema:
        - AttributeName: campId
          KeyType: HASH

  CampItemsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: camp-stock-camp-items
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: campId
          AttributeType: S
        - AttributeName: itemId
          AttributeType: S
      KeySchema:
        - AttributeName: campId
          KeyType: HASH
        - AttributeName: itemId
          KeyType: RANGE

  ApiFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: camp-stock-api
      CodeUri: ../backend
      Handler: src/handler.handler
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref ItemsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CampsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref CampItemsTable
      Events:
        ProxyApi:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: /{proxy+}
            Method: ANY

  # フロントエンド（Vite/Reactのビルド成果物）配信用。バケット自体はパブリック
  # アクセスをブロックし、CloudFrontのOrigin Access Control経由でのみ読み取りを許可する。
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "camp-stock-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

  FrontendOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "camp-stock-frontend-oac-${AWS::AccountId}"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        # SPAのクライアントサイドルーティング（react-router-domのBrowserRouter）向けに、
        # S3が返す403/404を200のindex.htmlへフォールバックさせる
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html
        Origins:
          - Id: FrontendBucketOrigin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: FrontendBucketOrigin
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # AWS managed: CachingOptimized

Outputs:
  ApiEndpoint:
    Description: API GatewayのベースURL
    Value: !Sub "https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com"
  ItemsTableName:
    Value: !Ref ItemsTable
  CampsTableName:
    Value: !Ref CampsTable
  CampItemsTableName:
    Value: !Ref CampItemsTable
  FrontendBucketName:
    Description: フロントエンドのビルド成果物をアップロードするS3バケット名
    Value: !Ref FrontendBucket
  FrontendDistributionId:
    Description: デプロイ後にキャッシュ無効化するCloudFrontディストリビューションID
    Value: !Ref FrontendDistribution
  FrontendUrl:
    Description: フロントエンドのアクセス先URL
    Value: !Sub "https://${FrontendDistribution.DomainName}"
